name: Build (Android APK + Windows EXE/MSI)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests (core)
        shell: bash
        run: |
          set -o pipefail
          gradle :core:test 2>&1 | tee -a build.log
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee -a build.log
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E -A2 "^e: |What went wrong|FAILED|^> [^T]|error:" build.log | grep -v "^--$" | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoameleYar-android.apk
      - name: Verify APK signature (fixed key)
        shell: bash
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs MoameleYar-android.apk | tee sig.txt
          grep -qi "aa:b2:40:80\|aab24080" <(tr -d ' ' < sig.txt | tr 'A-Z' 'a-z') && echo "::notice::APK signed with fixed MoameleYar key" || { echo "::error::unexpected signing key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: MoameleYar-android-apk
          path: MoameleYar-android.apk
      - name: Generate Gradle wrapper files
        run: gradle wrapper --gradle-version 8.7
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar

  windows:
    name: Windows installer (MSI + EXE + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Windows packages
        shell: bash
        run: |
          set -o pipefail
          gradle :desktop:packageMsi :desktop:packageExe :desktop:createDistributable 2>&1 | tee -a build.log
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E -A2 "^e: |What went wrong|FAILED|^> [^T]|error:" build.log | grep -v "^--$" | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Copy-Item -Destination out/MoameleYar-windows-setup.msi
          Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Copy-Item -Destination out/MoameleYar-windows-setup.exe
          Compress-Archive -Path desktop/build/compose/binaries/main/app/MoameleYar -DestinationPath out/MoameleYar-windows-portable.zip
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: MoameleYar-windows
          path: out/*
      - name: Self-test packaged app (live data, news, screen rendering)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "desktop/build/compose/binaries/main/app/MoameleYar/MoameleYar.exe"
          $dir = Join-Path $PWD "selftest"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest=$dir" -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Write-Host "::warning::self-test timed out" }
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host "===== SELFTEST BEGIN ====="
          if (Test-Path "$dir/selftest.txt") { Get-Content "$dir/selftest.txt" -Encoding UTF8 | Where-Object { $_ -notmatch '^IMG64 ' } } else { Write-Host "::warning::no selftest output" }
          Write-Host "===== SELFTEST END ====="
          if (Test-Path "$dir/selftest.txt") {
            Get-Content "$dir/selftest.txt" -Encoding UTF8 | Select-String -Pattern "^(outlook |sleeves|events|sound .*false|screenshot .*FAILED|SELFTEST CRASH|exit=|signals=|IMG64 .* size)" | Select-Object -First 10 | ForEach-Object { Write-Host "::notice::$($_.Line)" }
          }
      - name: Trend screenshots (base64 for review)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "selftest/selftest.txt") { Get-Content "selftest/selftest.txt" -Encoding UTF8 | Where-Object { $_ -match '^IMG64 \S+ \d+ ' } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: selftest/*
          if-no-files-found: ignore

  release:
    name: Publish downloadable build
    needs: [android, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List files
        run: ls -R dist
      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag -y --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "معامله‌یار — آخرین نسخه (اندروید + ویندوز)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            آخرین نسخه ساخته‌شده به‌صورت خودکار از شاخه `${{ github.ref_name }}` (کامیت ${{ github.sha }}).

            - **ویندوز (نصبی):** `MoameleYar-windows-setup.exe` یا `MoameleYar-windows-setup.msi`
            - **ویندوز (بدون نصب):** `MoameleYar-windows-portable.zip` → از حالت فشرده خارج کنید و `MoameleYar.exe` را اجرا کنید
            - **اندروید:** `MoameleYar-android.apk`

            ⚠️ هیچ رباتی سود را تضمین نمی‌کند. برنامه به‌صورت پیش‌فرض در حالت دمو (بدون پول واقعی) کار می‌کند.
          files: |
            dist/MoameleYar-windows/*
            dist/MoameleYar-android-apk/*
